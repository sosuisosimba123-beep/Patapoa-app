<main class="overlay-content flex flex-col justify-between">

<div class="flex items-center gap-md">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Pickup From</p>

</div>
</div>

<span class="material-symbols-outlined text-[18px]">directions</span>

</div>

<div class="absolute -bottom-1 -right-1 bg-primary text-white text-[10px] px-1.5 py-0.5 rounded-full border-2 border-surface font-bold">
                                    4.9★
                                </div>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Juma H.</h3>
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">verified</span>

<span class="font-label-caps text-label-caps tracking-widest uppercase">Heading to Store</span>
</div>

<!-- Script for Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple haptic-like scale effect for buttons
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('scale-95');
                });
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('scale-95');
                });
            });
        });
    </script>


</body></html>
