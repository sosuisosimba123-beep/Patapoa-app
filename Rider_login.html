<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>ShopLink Deliverer Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed-dim": "#b8c3ff",
                      "on-primary-fixed": "#00210e",
                      "error": "#ba1a1a",
                      "on-secondary-container": "#636467",
                      "on-primary": "#ffffff",
                      "inverse-on-surface": "#eef1f0",
                      "tertiary": "#124af0",
                      "on-secondary": "#ffffff",
                      "surface-container-high": "#e6e9e8",
                      "on-tertiary-fixed": "#001356",
                      "secondary-fixed-dim": "#c6c6c9",
                      "on-error": "#ffffff",
                      "on-background": "#181c1c",
                      "outline": "#6c7b6e",
                      "tertiary-fixed": "#dde1ff",
                      "primary-fixed-dim": "#30e286",
                      "surface-tint": "#006d3b",
                      "outline-variant": "#bbcbbb",
                      "on-primary-container": "#00532c",
                      "tertiary-container": "#a3b2ff",
                      "surface": "#f7faf9",
                      "primary-container": "#00d177",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#5bffa0",
                      "surface-variant": "#e0e3e2",
                      "secondary-container": "#e2e2e5",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#e2e2e5",
                      "on-tertiary": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#f1f4f3",
                      "surface-dim": "#d7dbda",
                      "surface-container": "#ebeeed",
                      "primary": "#006d3b",
                      "inverse-primary": "#30e286",
                      "on-secondary-fixed": "#1a1c1e",
                      "on-tertiary-fixed-variant": "#0035be",
                      "inverse-surface": "#2d3131",
                      "secondary": "#5d5e61",
                      "on-surface-variant": "#3c4a3f",
                      "on-tertiary-container": "#0035c0",
                      "surface-container-highest": "#e0e3e2",
                      "on-primary-fixed-variant": "#00522b",
                      "background": "#f7faf9",
                      "surface-bright": "#f7faf9",
                      "on-secondary-fixed-variant": "#454749",
                      "on-surface": "#181c1c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "8px",
                      "lg": "24px",
                      "xl": "32px",
                      "sm": "12px",
                      "safe-area-bottom": "44px",
                      "base": "4px",
                      "md": "16px"
              },
              "fontFamily": {
                      "headline-sm": ["Inter"],
                      "price-lg": ["Inter"],
                      "label-caps": ["Inter"],
                      "display-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-md": ["Inter"],
                      "distance-label": ["Inter"]
              },
              "fontSize": {
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "price-lg": ["20px", {"lineHeight": "24px", "fontWeight": "700"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "distance-label": ["13px", {"lineHeight": "16px", "fontWeight": "500"}]
              }
            },
          },
        }
    </script>
<style>
        .map-mesh {
            background-image: radial-gradient(circle at 2px 2px, #bbcbbb 1px, transparent 0);
            background-size: 24px 24px;
        }
        .glass-card {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden h-screen flex flex-col">
<!-- Background Layer -->
<div class="fixed inset-0 z-0 map-mesh opacity-20"></div>
<div class="fixed inset-0 z-0 bg-gradient-to-tr from-primary/5 via-transparent to-primary-container/10"></div>
<!-- Main Content -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-md">
<div class="w-full max-w-sm flex flex-col gap-xl">
<!-- Logo Section -->
<header class="text-center">
<div class="inline-flex items-center justify-center p-sm bg-primary-container rounded-xl shadow-md mb-md">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Delivery Pro</h1>
<p class="font-body-md text-on-surface-variant mt-xs">ShopLink Logistics Portal</p>
</header>
<!-- Login Form Card -->
<section class="glass-card p-lg rounded-xl border border-white shadow-lg">
<form class="flex flex-col gap-md" id="loginForm">
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-xs" for="phone">Phone Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">call</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg" id="phone" placeholder="+255 --- --- ---" required="" type="tel">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">lock</span>
<input class="w-full pl-xl pr-xl py-md bg-surface-container-low border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-md text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm py-md bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-lg shadow-md hover:shadow-lg active:scale-95 transition-all flex justify-center items-center gap-xs" type="submit">
                        Login
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</section>
<!-- Bottom Action -->
<footer class="text-center">
<p class="font-body-md text-on-surface-variant">
                    Want to join the fleet?
                    <a class="font-headline-sm text-primary hover:text-on-primary-container font-bold ml-xs transition-colors" href="#">Become a Deliverer</a>
</p>
</footer>
</div>
</main>
<!-- Contextual Map Hint (Visual Interest) -->
<div class="fixed bottom-0 right-0 w-48 h-48 -mr-12 -mb-12 opacity-40 pointer-events-none">
<div class="w-full h-full relative">
<div class="absolute inset-0 rounded-full border-[16px] border-primary-container/20 animate-[ping_4s_ease-in-out_infinite]"></div>
<div class="absolute inset-8 rounded-full border-[8px] border-primary/20 animate-[ping_3s_ease-in-out_infinite]"></div>
</div>
</div>
<!-- Decorative Image (Subtle context) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/10 blur-[100px] rounded-full"></div>
<div class="absolute top-1/2 -right-48 w-80 h-80 bg-tertiary-container/10 blur-[80px] rounded-full"></div>
</div>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        // Form submission micro-interaction
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Logging in...';
            
            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                btn.classList.replace('bg-primary-container', 'bg-tertiary');
                btn.classList.replace('text-on-primary-container', 'text-white');
                
                // Final destination redirect simulation
                setTimeout(() => {
                    alert('Redirecting to Active Tasks Dashboard...');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary', 'bg-primary-container');
                    btn.classList.replace('text-white', 'text-on-primary-container');
                }, 1000);
            }, 1500);
        });

        // Simple parallax on map texture
        window.addEventListener('mousemove', (e) => {
            const mesh = document.querySelector('.map-mesh');
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            mesh.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>
