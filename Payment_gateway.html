<script>
        function selectPayment(element) {
            // Remove active classes from all options
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('border-primary', 'bg-primary-container/10');
                opt.querySelector('.indicator > div').classList.add('scale-0');
                opt.querySelector('.indicator > div').classList.remove('scale-100');
            });

            // Add active classes to selected
            element.classList.add('border-primary', 'bg-primary-container/10');
            const radio = element.querySelector('input[type="radio"]');
            radio.checked = true;
            
            const indicator = element.querySelector('.indicator > div');
            indicator.classList.remove('scale-0');
            indicator.classList.add('scale-100');
            
            // Haptic feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Initialize first selection
        document.addEventListener('DOMContentLoaded', () => {
            const initial = document.querySelector('input[name="payment"]:checked').closest('.payment-option');
            if (initial) selectPayment(initial);
        });
    </script>
