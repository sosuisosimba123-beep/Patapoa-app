<!-- Custom Pin: Pickup (Hardware Shop) -->

<div class="flex flex-col items-center">
<div class="bg-primary text-on-primary px-sm py-xs rounded-lg shadow-lg mb-base flex items-center gap-xs">

<span class="text-label-caps font-label-caps">Kurasini Hardware</span>
</div>

</div>

<!-- Success Feedback Overlay (Hidden by default) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300" id="feedback">
<div class="bg-on-surface/80 backdrop-blur-md text-white p-lg rounded-2xl flex flex-col items-center gap-sm">
<span class="material-symbols-outlined text-[48px] text-primary-container">check_circle</span>
<p class="font-headline-sm">Location Confirmed</p>
</div>
</div>
<script>
        // Simple Interaction Logic
        document.querySelector('button.bg-primary-container').addEventListener('click', function() {
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('opacity-0');
            feedback.classList.add('opacity-100');
            
            setTimeout(() => {
                feedback.classList.remove('opacity-100');
                feedback.classList.add('opacity-0');
            }, 2000);
        });

        // Handle Map Panning Simulation (Visual only)
        let isDragging = false;
        const map = document.querySelector('main');
        
        map.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        
        map.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            // Visual feedback of interaction
            map.style.cursor = 'grabbing';
        });
    </script>
