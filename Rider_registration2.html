<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">

    <!-- Top Navigation Header -->
    <header class="w-full top-0 sticky bg-surface shadow-sm z-50 flex justify-between items-center px-md py-xs">
        <div class="flex items-center gap-sm">
            <button class="material-symbols-outlined text-primary p-xs active:scale-95 transition-transform" aria-label="Back">arrow_back</button>
            <span class="font-headline-sm text-headline-sm text-on-surface">Vehicle Details</span>
        </div>
        <div class="flex items-center">
            <span class="font-label-caps text-label-caps text-on-surface-variant px-sm">STEP 2 OF 3</span>
        </div>
    </header>

    <main class="w-full max-w-md px-md py-lg flex flex-col gap-lg pb-32">
        
        <!-- Progress Indicator Visual -->
        <div class="flex gap-xs w-full">
            <div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
            <div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
            <div class="h-1.5 flex-1 rounded-full bg-surface-variant"></div>
        </div>

        <section class="flex flex-col gap-md">
            <h1 class="font-headline-md text-headline-md text-on-surface">Tell us about your ride</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Choose the vehicle you'll be using for deliveries to get the right tasks.</p>
        </section>

        <!-- Vehicle Type Selection -->
        <section class="grid grid-cols-3 gap-sm">
            <div class="relative">
                <input type="radio" name="vehicle_type" id="bicycle" class="hidden vehicle-option" checked="">
                <label for="bicycle" class="flex flex-col items-center justify-center p-md border-2 border-outline-variant rounded-xl cursor-pointer hover:bg-surface-variant/20 transition-all active:scale-95">
                    <span class="material-symbols-outlined text-primary mb-xs" style="font-size: 32px;">pedal_bike</span>
                    <span class="font-label-caps text-label-caps text-on-surface">Bicycle</span>
                </label>
            </div>
            <div class="relative">
                <input type="radio" name="vehicle_type" id="boda" class="hidden vehicle-option">
                <label for="boda" class="flex flex-col items-center justify-center p-md border-2 border-outline-variant rounded-xl cursor-pointer hover:bg-surface-variant/20 transition-all active:scale-95">
                    <span class="material-symbols-outlined text-primary mb-xs" style="font-size: 32px;">motorcycle</span>
                    <span class="font-label-caps text-label-caps text-on-surface text-center">Boda Boda</span>
                </label>
            </div>
            <div class="relative">
                <input type="radio" name="vehicle_type" id="car" class="hidden vehicle-option">
                <label for="car" class="flex flex-col items-center justify-center p-md border-2 border-outline-variant rounded-xl cursor-pointer hover:bg-surface-variant/20 transition-all active:scale-95">
                    <span class="material-symbols-outlined text-primary mb-xs" style="font-size: 32px;">directions_car</span>
                    <span class="font-label-caps text-label-caps text-on-surface">Car</span>
                </label>
            </div>
        </section>

        <!-- Input Fields Group -->
        <section class="flex flex-col gap-md">
            <div class="flex flex-col gap-xs">
                <label for="license_plate" class="font-label-caps text-label-caps text-on-surface-variant">License Plate Number</label>
                <div class="relative">
                    <span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">tag</span>
                    <input type="text" id="license_plate" placeholder="E.g. T 123 ABC" class="w-full pl-[48px] pr-md py-md rounded-xl border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-surface outline-none transition-all">
                </div>
            </div>

            <div class="flex flex-col gap-xs">
                <label for="driver_license" class="font-label-caps text-label-caps text-on-surface-variant">Driver's License Number</label>
                <div class="relative">
                    <span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">badge</span>
                    <input type="text" id="driver_license" placeholder="Enter license number" class="w-full pl-[48px] pr-md py-md rounded-xl border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-surface outline-none transition-all">
                </div>
            </div>
        </section>

        <!-- Document Upload Grid -->
        

        <!-- Background Image/Graphic -->
        <div class="w-full rounded-2xl overflow-hidden relative h-40 mt-sm">
            <img src="https://images.unsplash.com/photo-1599423300746-b62533397364?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1200&amp;q=80" data-alt="A clean and professional photograph of a modern delivery motorcycle parked in a sun-drenched Dar es Salaam street. The lighting is soft and warm, capturing the bright green accents of a logistics brand. The background is a blurred cityscape with modern architecture, reflecting a reliable and progressive delivery service environment. The image uses high-contrast, clean lines and a vibrant color palette of greens and whites." class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-md">
                <span class="text-white font-body-md">Ensuring safe and verified deliveries across Tanzania.</span>
            </div>
        </div>
    </main>

    <!-- Sticky Footer Action -->
    <footer class="fixed bottom-0 left-0 w-full bg-surface shadow-[0_-4px_16px_rgba(0,0,0,0.08)] p-md flex flex-col gap-sm z-50">
        <button onclick="window.location.reload()" class="w-full bg-primary-container text-on-primary-container font-headline-sm py-md rounded-full shadow-md active:scale-[0.98] transition-all flex justify-center items-center gap-xs">
            Continue
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div class="w-full text-center">
            <span class="font-label-caps text-label-caps text-secondary">Step 2 of 3 • Secure Verification</span>
        </div>
    </footer>

    <script>
        // Simple micro-interaction for vehicle selection
        const radioButtons = document.querySelectorAll('.vehicle-option');
        radioButtons.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Potential logic for updating document requirements based on vehicle
                const carSpecificFields = ['license_plate', 'driver_license'];
                if(e.target.id === 'bicycle') {
                    console.log('Bicycle selected: documents simplified');
                } else {
                    console.log('Motorized vehicle selected: documents required');
                }
            });
        });

        // Click interaction for upload slots
        document.querySelectorAll('.border-dashed').forEach(slot => {
            slot.addEventListener('click', () => {
                const span = slot.querySelector('.material-symbols-outlined');
                span.innerText = 'check_circle';
                span.style.color = '#006d3b';
                slot.classList.add('bg-primary-container/20');
                slot.querySelector('span:last-child').innerText = 'File Selected';
            });
        });
    </script>
