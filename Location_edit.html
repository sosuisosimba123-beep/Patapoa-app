<script>
        // Simple Interaction logic for input focus states and button feedback
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            el.addEventListener('blur', () => {
                el.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Mimic a "Detecting Location" state
        const geoBtn = document.querySelector('button:has(span:contains("my_location"))');
        if (geoBtn) {
            geoBtn.addEventListener('click', () => {
                const icon = geoBtn.querySelector('.material-symbols-outlined');
                icon.classList.add('animate-spin');
                geoBtn.querySelector('span:not(.material-symbols-outlined)').textContent = "Detecting...";
                
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                    geoBtn.querySelector('span:not(.material-symbols-outlined)').textContent = "Location Found";
                    geoBtn.classList.add('bg-primary/10', 'border-primary');
                }, 1500);
            });
        }

        // Custom selector for containing text in vanilla JS
        window.addEventListener('DOMContentLoaded', () => {
            const btns = document.getElementsByTagName('button');
            for(let btn of btns) {
                if(btn.textContent.includes('Use Current Location')) {
                    btn.addEventListener('click', function() {
                        const icon = this.querySelector('.material-symbols-outlined');
                        const text = this.querySelector('span:not(.material-symbols-outlined)');
                        icon.style.transition = 'transform 0.5s';
                        icon.style.transform = 'rotate(360deg)';
                        text.textContent = "Detecting...";
                        
                        setTimeout(() => {
                            text.textContent = "Location Detected";
                            this.classList.add('bg-primary/5', 'border-primary');
                        }, 1200);
                    });
                }
            }
        });
    </script>
