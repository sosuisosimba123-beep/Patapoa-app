<!-- Micro-interaction Scripts -->
<script>
        // Timer Logic
        let timeLeft = 15;
        const totalTime = 15;
        const circle = document.getElementById('timerCircle');
        const text = document.getElementById('countdownText');
        const circumference = 2 * Math.PI * 20;

        const timer = setInterval(() => {
            timeLeft--;
            text.textContent = timeLeft;
            
            const offset = circumference - (timeLeft / totalTime) * circumference;
            circle.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(timer);
                // Simulation: Close request if not accepted
                document.body.classList.add('opacity-0');
                setTimeout(() => window.location.reload(), 1000);
            }
        }, 1000);

        // Accept Logic
        document.getElementById('acceptBtn').addEventListener('click', () => {
            clearInterval(timer);
            const btn = document.getElementById('acceptBtn');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> <span class="font-headline-sm">Processing...</span>';
            
            setTimeout(() => {
                btn.classList.replace('bg-primary-container', 'bg-primary');
                btn.classList.add('text-white');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span class="font-headline-sm">Order Accepted</span>';
            }, 800);
        });

        // Add shimmer keyframe
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shimmer {
                100% { transform: translateX(100%); }
            }
        `;
        document.head.appendChild(style);
    </script>
