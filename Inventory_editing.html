<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Edit Product | ShopLink Merchant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Shared Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#3c4a3f",
                    "inverse-on-surface": "#eef1f0",
                    "on-surface": "#181c1c",
                    "on-error-container": "#93000a",
                    "on-secondary": "#ffffff",
                    "tertiary-container": "#a3b2ff",
                    "surface-tint": "#006d3b",
                    "secondary": "#5d5e61",
                    "on-tertiary-container": "#0035c0",
                    "tertiary-fixed": "#dde1ff",
                    "surface-dim": "#d7dbda",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed-dim": "#c6c6c9",
                    "on-primary-fixed-variant": "#00522b",
                    "surface": "#f7faf9",
                    "on-primary-container": "#00532c",
                    "outline-variant": "#bbcbbb",
                    "inverse-surface": "#2d3131",
                    "on-tertiary-fixed-variant": "#0035be",
                    "error-container": "#ffdad6",
                    "primary-container": "#00d177",
                    "primary-fixed-dim": "#30e286",
                    "background": "#f7faf9",
                    "surface-container-low": "#f1f4f3",
                    "on-background": "#181c1c",
                    "surface-variant": "#e0e3e2",
                    "surface-container-high": "#e6e9e8",
                    "on-tertiary-fixed": "#001356",
                    "surface-container": "#ebeeed",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "tertiary": "#124af0",
                    "on-secondary-fixed": "#1a1c1e",
                    "surface-container-highest": "#e0e3e2",
                    "surface-bright": "#f7faf9",
                    "secondary-container": "#e2e2e5",
                    "primary-fixed": "#5bffa0",
                    "primary": "#006d3b",
                    "secondary-fixed": "#e2e2e5",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#00210e",
                    "inverse-primary": "#30e286",
                    "tertiary-fixed-dim": "#b8c3ff",
                    "on-secondary-container": "#636467",
                    "error": "#ba1a1a",
                    "outline": "#6c7b6e",
                    "on-secondary-fixed-variant": "#454749"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "base": "4px",
                    "md": "16px",
                    "safe-area-bottom": "44px",
                    "sm": "12px",
                    "lg": "24px",
                    "xs": "8px"
            },
            "fontFamily": {
                    "headline-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "price-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "headline-md": ["Inter"],
                    "distance-label": ["Inter"]
            },
            "fontSize": {
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "price-lg": ["20px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "distance-label": ["13px", {"lineHeight": "16px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for better merchant experience */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f4f3;
        }
        ::-webkit-scrollbar-thumb {
            background: #bbcbbb;
            border-radius: 10px;
        }
        .input-focus-ring:focus {
            box-shadow: 0 0 0 2px #00d177;
            border-color: #00d177;
        }
        .bottom-sheet-shadow {
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-safe-area-bottom">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface h-16 flex items-center justify-between px-md shadow-none border-none">
<div class="flex items-center gap-md">
<button aria-label="Back to Inventory" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Edit Product</h1>
</div>
<div class="flex items-center">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-md pb-32 max-w-2xl mx-auto">
<form class="space-y-lg" id="productForm">
<!-- Photo Upload Area (Optional) -->
<section class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between">
<span>Product Photo</span>
<span class="opacity-60 italic">Optional</span>
</label>
<div class="relative group aspect-video rounded-xl overflow-hidden bg-surface-container-high border-2 border-dashed border-outline-variant hover:border-primary transition-all cursor-pointer flex flex-col items-center justify-center gap-xs">
<img alt="Product" class="absolute inset-0 w-full h-full object-cover" data-alt="A professional product shot of a sleek, high-end crimson red running shoe presented against a minimalist, clean white background with soft studio lighting. The lighting creates subtle, sophisticated shadows that emphasize the texture and ergonomic design of the sneaker. The overall aesthetic is modern, commercial, and bright, fitting a high-performance sports brand identity with a focus on vibrant color and technical detail." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBN-WCHmWgChbuBHpOsRQrzStYs2DBfo-M5KQuXsLsoPS9XHVYYrLtaJaCLX5gA0AggNZm_O2h7xpSaEmnRFLakEla5gC7ru5cAOVQ_KvfOr4FPjuqjpe5mFOnD1U_Hnh_bjE3Zv1v1827RotxNzO39rWsgKA8FWTSlLwp-G4ERo-XCiFnA3FdlGIkMAXfZhNi-m1cM3HZfuFAMxTzYmaOzMHsWJ7q1A5E-vRzbwpNfrxgFXb1N49ZQZsCVKIDyYhNg6pvgv0CBBfp-"/>
<div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<div class="bg-surface rounded-full p-sm flex items-center gap-xs shadow-lg">
<span class="material-symbols-outlined text-primary">add_a_photo</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Replace Photo</span>
</div>
</div>
</div>
</section>
<!-- Product Identity -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="productName">Product Name</label>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface input-focus-ring outline-none" id="productName" placeholder="Enter product name" type="text" value="Nike Air Zoom Pegasus"/>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="category">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border-outline-variant rounded-xl p-md pr-12 font-body-md text-body-md text-on-surface input-focus-ring outline-none" id="category">
<option selected="" value="footwear">Footwear</option>
<option value="apparel">Apparel</option>
<option value="accessories">Accessories</option>
<option value="electronics">Electronics</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Pricing & Inventory -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="price">Price (TZS)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant">TSh</span>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-xl p-md pl-14 font-body-md text-body-md text-on-surface input-focus-ring outline-none" id="price" placeholder="0.00" type="number" value="285000"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="sku">SKU / Serial Number</label>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface input-focus-ring outline-none" id="sku" placeholder="e.g. SKU-12345" type="text" value="SHO-NK-2210-RD"/>
</div>
</div>
<!-- Description -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface input-focus-ring outline-none resize-none" id="description" placeholder="Describe the item features, materials, and sizing..." rows="4">High-performance running shoe with responsive cushioning and a breathable mesh upper. Ideal for long-distance training and casual athletic wear.</textarea>
</div>
<!-- Optional Stock Field -->
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant/30">
<div class="flex items-center justify-between mb-sm">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">Quantity in Stock</span>
<span class="text-[10px] text-on-surface-variant/70 italic">Optional tracking</span>
</div>
<div class="flex items-center bg-surface-container-lowest rounded-full border border-outline-variant p-1">
<button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container-high rounded-full transition-colors" onclick="decrement()" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="w-16 text-center border-none bg-transparent font-headline-sm text-headline-sm focus:ring-0 p-0" id="quantity" min="0" type="number" value="24"/>
<button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container-high rounded-full transition-colors" onclick="increment()" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant/80">Updating this will automatically reflect in your public storefront inventory.</p>
</div>
<!-- Dangerous Area -->
<div class="pt-8 border-t border-outline-variant">
<button class="w-full flex items-center justify-center gap-xs py-md px-lg text-error hover:bg-error-container/20 rounded-xl transition-colors font-body-md text-body-md font-semibold border border-transparent hover:border-error-container" type="button">
<span class="material-symbols-outlined">delete</span>
                    Delete Product
                </button>
</div>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 right-0 p-md bg-surface border-t border-surface-container-high bottom-sheet-shadow flex gap-md z-50">
<button class="flex-1 bg-primary text-on-primary font-body-lg text-body-lg font-bold py-md rounded-xl hover:bg-primary/90 active:scale-[0.98] transition-all shadow-lg flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">check</span>
            Save Changes
        </button>
</div>
<script>
        function increment() {
            const input = document.getElementById('quantity');
            input.value = parseInt(input.value) + 1;
        }
        function decrement() {
            const input = document.getElementById('quantity');
            if (parseInt(input.value) > 0) {
                input.value = parseInt(input.value) - 1;
            }
        }

        // Simple button active state feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('opacity-80'));
            btn.addEventListener('mouseup', () => btn.classList.remove('opacity-80'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('opacity-80'));
        });
    </script>
</body></html>
