<!-- Suppression logic: This is a task-focused "Live Tracking" sub-page with a "Back" button, so we exclude the full BottomNavBar to focus on the map and status. -->
<script>
        // Simple micro-interaction for rider movement simulation
        const riderMarker = document.querySelector('g[transform="translate(230, 420)"]');
        let progress = 0;
        
        function animateRider() {
            progress += 0.002;
            if (progress > 1) progress = 0;
            
            // Parametric movement along a simulated path
            const x = 230 + Math.sin(progress * 10) * 10;
            const y = 420 + Math.cos(progress * 10) * 10;
            
            if (riderMarker) {
                riderMarker.setAttribute('transform', `translate(${x}, ${y})`);
            }
            requestAnimationFrame(animateRider);
        }
        
        animateRider();

        // Simulate ETA countdown
        let eta = 12;
        const etaDisplay = document.querySelector('.text-headline-md');
        setInterval(() => {
            if (Math.random() > 0.95 && eta > 1) {
                eta--;
                if (etaDisplay) etaDisplay.textContent = eta;
            }
        }, 5000);
    </script>
